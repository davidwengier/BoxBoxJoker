<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Max Game</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    main {
      width: min(42rem, 100%);
      text-align: center;
    }

    h1 {
      margin-bottom: 0.25rem;
      font-size: clamp(2rem, 8vw, 4rem);
    }

    p {
      color: #cbd5e1;
    }

    .status {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 1.5rem 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    #arena {
      position: relative;
      height: min(60vh, 28rem);
      overflow: hidden;
      border: 2px solid #475569;
      border-radius: 1rem;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
    }

    #target {
      position: absolute;
      width: 4rem;
      height: 4rem;
      border: 0;
      border-radius: 50%;
      background: #f43f5e;
      box-shadow: 0 0 1.5rem rgb(244 63 94 / 70%);
      cursor: pointer;
      transition: transform 80ms ease;
    }

    #target:hover {
      transform: scale(1.08);
    }

    #target:disabled {
      display: none;
    }

    #start {
      margin-top: 1.25rem;
      padding: 0.75rem 1.5rem;
      border: 0;
      border-radius: 999px;
      background: #22c55e;
      color: #052e16;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    #start:disabled {
      opacity: 0.5;
      cursor: wait;
    }
  </style>
</head>
<body>
  <main>
    <h1>Max Game</h1>
    <p>Click the target as many times as you can before time runs out.</p>

    <div class="status" aria-live="polite">
      <span>Score: <span id="score">0</span></span>
      <span>Time: <span id="time">20</span>s</span>
    </div>

    <div id="arena">
      <button id="target" type="button" aria-label="Target" disabled></button>
    </div>

    <button id="start" type="button">Start game</button>
  </main>

  <script>
    const arena = document.querySelector("#arena");
    const target = document.querySelector("#target");
    const startButton = document.querySelector("#start");
    const scoreDisplay = document.querySelector("#score");
    const timeDisplay = document.querySelector("#time");

    let score = 0;
    let timeRemaining = 20;
    let timer;

    function moveTarget() {
      const maxX = arena.clientWidth - target.offsetWidth;
      const maxY = arena.clientHeight - target.offsetHeight;
      target.style.left = `${Math.random() * maxX}px`;
      target.style.top = `${Math.random() * maxY}px`;
    }

    function finishGame() {
      clearInterval(timer);
      target.disabled = true;
      startButton.disabled = false;
      startButton.textContent = `Play again - score: ${score}`;
    }

    function startGame() {
      score = 0;
      timeRemaining = 20;
      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeRemaining;
      startButton.disabled = true;
      target.disabled = false;
      moveTarget();

      timer = setInterval(() => {
        timeRemaining -= 1;
        timeDisplay.textContent = timeRemaining;

        if (timeRemaining === 0) {
          finishGame();
        }
      }, 1000);
    }

    target.addEventListener("click", () => {
      score += 1;
      scoreDisplay.textContent = score;
      moveTarget();
    });

    startButton.addEventListener("click", startGame);
    window.addEventListener("resize", () => {
      if (!target.disabled) {
        moveTarget();
      }
    });
  </script>
</body>
</html>
